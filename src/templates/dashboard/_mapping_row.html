<tr id="mapping-row-{{ m.id }}" class="hover:bg-gray-50 group">
  <td class="px-4 py-3">
    <span class="font-mono text-sm text-gray-700 font-medium">
      {{ m.source_field.path }}
    </span>
    <span class="ml-1.5 text-xs text-gray-400">({{ m.source_field.field_type }})</span>
  </td>
  <td class="px-4 py-3 font-mono text-sm text-gray-800">{{ m.target_field }}</td>
  {% if template_format == "xlsx" %}
    <td class="px-4 py-3 font-mono text-sm text-gray-600">{{ m.sheet_name|default:"—" }}</td>
  {% endif %}
  <td class="px-4 py-3">
    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-indigo-50 text-indigo-700">
      {{ m.handler_method }}
    </span>
  </td>
  <td class="px-4 py-3">
    {% if editable|default:True %}
    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
      <button
        title="Edit"
        class="p-1.5 rounded hover:bg-indigo-50 text-gray-400 hover:text-indigo-600 transition-colors"
        hx-get="/templates/{{ template_id }}/mappings/{{ m.id }}/edit/"
        hx-target="#mapping-row-{{ m.id }}"
        hx-swap="outerHTML">
        {% include "dashboard/_icon.html" with name="pencil" icon_class="w-3.5 h-3.5" %}
      </button>
      <button
        title="Delete"
        class="p-1.5 rounded hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors"
        hx-post="/templates/{{ template_id }}/mappings/{{ m.id }}/delete/"
        hx-target="#mapping-row-{{ m.id }}"
        hx-swap="outerHTML"
        hx-confirm="Delete this mapping?"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        {% include "dashboard/_icon.html" with name="trash" icon_class="w-3.5 h-3.5" %}
      </button>
    </div>
    {% endif %}
  </td>
</tr>
