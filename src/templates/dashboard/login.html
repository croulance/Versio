<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versio — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <span class="text-indigo-600 font-bold text-2xl tracking-tight">Versio</span>
      <p class="text-gray-400 text-sm mt-1">Template editor</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">

      {% if error %}
        <div class="mb-5 flex items-center gap-2.5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/login/" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1.5">Email</label>
          <input
            type="email" name="email" value="{{ email|default:'' }}"
            required autofocus
            class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1.5">Password</label>
          <input
            type="password" name="password" required
            class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition">
        </div>

        <button
          type="submit"
          class="mt-2 w-full rounded-lg bg-indigo-600 text-white text-sm font-medium py-2.5 hover:bg-indigo-700 active:bg-indigo-800 transition-colors">
          Sign in
        </button>
      </form>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Contact your administrator to obtain credentials.
    </p>

  </div>

</body>
</html>
