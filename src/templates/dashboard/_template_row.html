{% load dashboard_extras %}
<tr class="hover:bg-gray-50 {% if active_id == t.id|stringformat:'s' %}bg-indigo-50/40{% endif %}">
  <td class="px-4 py-3 text-sm text-gray-800 font-medium">
    <a href="/templates/?t={{ t.id }}"
      hx-get="/templates/{{ t.id }}/"
      hx-target="#editor-panel"
      hx-push-url="?t={{ t.id }}"
      class="hover:text-indigo-600 hover:underline transition-colors">
      {{ t.name }}
    </a>
  </td>
  <td class="px-4 py-3 text-sm text-gray-700 uppercase">{{ t.format }}</td>
  <td class="px-4 py-3 text-sm text-gray-700">v{{ t.version }}</td>
  <td class="px-4 py-3">
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold uppercase {{ t.status|template_status_classes }}">
      {{ t.status }}
    </span>
  </td>
  <td class="px-4 py-3">
    <a href="/templates/?t={{ t.id }}"
      hx-get="/templates/{{ t.id }}/"
      hx-target="#editor-panel"
      hx-push-url="?t={{ t.id }}"
      class="inline-flex items-center gap-1 px-2 py-1 rounded-md border border-gray-200 text-xs font-medium text-gray-600 hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
      {% include "dashboard/_icon.html" with name="pencil" icon_class="w-3 h-3" %}
      Edit
    </a>
  </td>
</tr>
