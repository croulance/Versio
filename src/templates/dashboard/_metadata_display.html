<div id="metadata-block">
  {% if template.editable %}
    <textarea
      name="metadata"
      placeholder='{"root_element": "records"}'
      hx-post="/templates/{{ template.id }}/metadata/"
      hx-trigger="change"
      hx-target="#metadata-block"
      hx-swap="outerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      rows="4"
      class="text-sm font-mono border-2 border-gray-300 rounded-lg px-3 py-2 w-full max-w-xl bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
    >{{ template.metadata_text }}</textarea>
  {% else %}
    <pre class="text-sm bg-gray-100 px-3 py-2 rounded-lg text-gray-700 border border-gray-200 w-full max-w-xl overflow-x-auto">{{ template.metadata_text }}</pre>
  {% endif %}
  {% include "dashboard/_saved_flash.html" %}
  {% include "dashboard/_field_error.html" %}
</div>
